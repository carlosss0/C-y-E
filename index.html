<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; background: #000; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 0; cursor: grab; }
        #bg-canvas:active { cursor: grabbing; }

        /* ----- PANTALLA DE LOGIN ----- */
        #login-wrapper {
            position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at bottom, rgba(27,39,53,0.8) 0%, rgba(9,10,15,0.95) 100%);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #login-screen {
            position: relative; background: rgba(255, 255, 255, 0.05); padding: 40px 30px;
            border-radius: 20px; text-align: center; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1); width: 300px; transition: transform 0.8s ease;
        }
        #login-screen h2 { margin-top: 0; margin-bottom: 25px; font-weight: 400; font-size: 22px; }
        #name-input {
            padding: 12px 15px; border-radius: 25px; border: none; outline: none;
            font-size: 16px; width: 80%; margin-bottom: 20px; text-align: center;
        }
        #btn-enter {
            background-color: #ff66b2; color: white; border: none; padding: 10px 30px;
            font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        #btn-enter:hover { background-color: #ff4d94; transform: scale(1.05); }
        #error-msg {
            margin-top: 20px; color: #ffb3d9; font-size: 18px; font-weight: bold;
            display: none; animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* ----- MODAL DE FOTOS ----- */
        #message-overlay {
            position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(40,5,15,0.85), rgba(0,0,0,0.95));
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 30; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #message-overlay.show { opacity: 1; pointer-events: auto; }
        #message-card {
            max-width: 560px; width: 90%; padding: 40px 30px; text-align: center; transform: translateY(20px) scale(0.95);
            transition: transform 0.6s cubic-bezier(0.2,0.8,0.2,1); position: relative;
        }
        #message-overlay.show #message-card { transform: translateY(0) scale(1); }
        #message-image-wrap {
            position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 18px; margin: 0 auto 30px;
            display: flex; align-items: center; justify-content: center; background: #000;
            box-shadow: 0 0 40px rgba(255,102,178,0.4); animation: floaty 4s ease-in-out infinite;
        }
        #message-image-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(18px) brightness(0.5) saturate(1.3); transform: scale(1.1); }
        #message-image { position: relative; z-index: 1; max-width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
        @keyframes floaty { 0%, 100% { transform: translateY(0); } 50%  { transform: translateY(-10px); } }
        
        #message-title { font-size: 32px; font-weight: 700; color: #fff; margin: 0 0 30px; letter-spacing: 0.05em; text-shadow: 0 0 20px rgba(255,102,178,0.7); font-style: italic; }
        #message-close { background: transparent; border: 1px solid rgba(255,102,178,0.5); color: rgba(255,220,230,0.9); padding: 10px 28px; font-size: 12px; letter-spacing: 0.2em; border-radius: 999px; cursor: pointer; transition: all 0.3s; }
        #message-close:hover { background: rgba(255,102,178,0.5); color: #fff; }

        /* ----- PANTALLA DEL RAMO (BOUQUET) ----- */
        #bouquet-overlay {
            position: fixed; inset: 0; background: radial-gradient(circle, #061616, #000 65%);
            z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
        }
        #bouquet-overlay.show { opacity: 1; pointer-events: auto; }
        
        .stars {
            position: absolute; inset: 0;
            background-image:
                radial-gradient(circle, #ffff7a 2px, transparent 3px),
                radial-gradient(circle, #5fffff 2px, transparent 3px),
                radial-gradient(circle, #fff 1px, transparent 2px);
            background-size: 160px 160px, 220px 220px, 120px 120px;
            animation: starsMove 10s linear infinite; opacity: 0.7; z-index: 1;
        }
        @keyframes starsMove { to { background-position: 0 -500px, 150px -400px, -100px -300px; } }

        .bq-texts {
            position: relative; z-index: 10; width: 90%; max-width: 600px;
            text-align: center; margin-top: 8vh;
        }
        .bq-line {
            font-size: clamp(16px, 4.5vw, 22px); margin-bottom: 12px; opacity: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5); animation: bqFade 1.5s forwards;
            font-family: 'Georgia', serif; font-style: italic;
        }
        .bq-line.final {
            font-size: clamp(24px, 7vw, 36px); font-weight: bold; color: #ff66b2;
            text-shadow: 0 0 15px #ff66b2, 0 0 30px #ff1493; margin-top: 25px;
            font-style: normal;
        }
        @keyframes bqFade { to { opacity: 1; transform: translateY(0); } from { transform: translateY(15px); } }

        .bouquet {
            position: absolute; bottom: 0; width: 100%; max-width: 400px; height: 50vh; min-height: 400px;
            z-index: 2; transform: scale(0.9); animation: rise 2.5s ease forwards;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(150px) scale(0.7); } to { opacity: 1; transform: translateY(0) scale(0.9); } }

        .flower { position: absolute; transform-origin: bottom center; animation: sway 3s ease-in-out infinite alternate; }
        @keyframes sway { from { transform: rotate(var(--r)); } to { transform: rotate(calc(var(--r) + 4deg)); } }

        .stem { width: 8px; height: 330px; background: linear-gradient(#8fffff, #087979); border-radius: 20px; box-shadow: 0 0 15px cyan; }
        .leaf { position: absolute; width: 45px; height: 85px; background: linear-gradient(135deg, #68ffff, #0b7777); border-radius: 100% 0 100% 0; box-shadow: 0 0 12px cyan; }
        .leaf.left { top: 170px; left: -42px; transform: rotate(-35deg); }
        .leaf.right { top: 230px; left: 5px; transform: rotate(40deg) scaleX(-1); }

        .iris-head { position: absolute; top: -55px; left: -45px; width: 100px; height: 100px; }
        .iris-head span { position: absolute; width: 55px; height: 78px; background: linear-gradient(#fff, #a8f7ff, #6458ff); border-radius: 60% 60% 25% 60%; box-shadow: 0 0 15px white, 0 0 35px cyan; }
        .iris-head span:nth-child(1) { left: 22px; top: 0; }
        .iris-head span:nth-child(2) { left: 0; top: 30px; transform: rotate(-55deg); }
        .iris-head span:nth-child(3) { right: 0; top: 30px; transform: rotate(55deg); }
        .center { position: absolute; width: 32px; height: 13px; background: #fff59d; border-radius: 50%; top: 58px; left: 34px; box-shadow: 0 0 15px yellow; }

        .tulip-head { position: absolute; top: -58px; left: -35px; width: 80px; height: 85px; }
        .tulip-head span { position: absolute; bottom: 0; width: 45px; height: 75px; background: linear-gradient(#fff, #ffc2ef, #ff4fc3); border-radius: 50% 50% 15% 15%; box-shadow: 0 0 15px white, 0 0 30px #ff8be0; }
        .tulip-head span:nth-child(1) { left: 17px; z-index: 2; }
        .tulip-head span:nth-child(2) { left: 0; transform: rotate(-25deg); }
        .tulip-head span:nth-child(3) { right: 0; transform: rotate(25deg); }
        
        #btn-volver { position: absolute; top: 20px; right: 20px; z-index: 50; background: rgba(255,255,255,0.1); border: 1px solid cyan; color: cyan; padding: 8px 15px; border-radius: 20px; cursor: pointer; opacity: 0; animation: bqFade 1s forwards 12s; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-wrapper">
        <div id="login-screen">
            <h2>¿Nombre del amor de tu vida?</h2>
            <input type="text" id="name-input" placeholder="Escribe aquí..." autocomplete="off">
            <br>
            <button id="btn-enter">Responder</button>
            <div id="error-msg">Carlos y De La Rose ❤️</div>
        </div>
    </div>

    <!-- MODAL PARA LAS FOTOS DE LOS CORAZONES -->
    <div id="message-overlay">
        <div id="message-card">
            <div id="message-image-wrap" id="img-container">
                <img id="message-image-bg" src="" alt="" aria-hidden="true" crossorigin="anonymous">
                <img id="message-image" src="" alt="" crossorigin="anonymous">
            </div>
            <h2 id="message-title"></h2>
            <button id="message-close">Cerrar ✦</button>
        </div>
    </div>

    <!-- NUEVA PANTALLA DE LA DECLARACIÓN (RAMO) -->
    <div id="bouquet-overlay">
        <div class="stars"></div>
        <button id="btn-volver" onclick="closeBouquet()">Volver</button>
        
        <div class="bq-texts" id="bq-texts-container">
            <!-- Los textos se inyectan con JS para reiniciar la animación -->
        </div>
        
        <div class="bouquet" id="bouquet-container">
            <!-- Las 16 flores se inyectan con JS -->
        </div>
    </div>

    <script id="plate-gen">
        window.plates = [
            { "name": "TE AMO ❤️", "src": "imagen1.jpeg", "hue": 355, "pattern": "heart" },
            { "name": "Mi todo", "src": "imagen2.jpeg", "hue": 0, "pattern": "heart" },
            { "name": "El amor de mi vida", "src": "imagen3.jpeg", "hue": 350, "pattern": "heart" },
            { "name": "Mi universo entero", "src": "imagen4.jpeg", "hue": 358, "pattern": "heart" },
            { "name": "La niña de mis ojos", "src": "imagen5.jpeg", "hue": 355, "pattern": "heart" },
            { "name": "Spidey", "icon": "spiderman.png", "isSpidey": true, "hue": 0 } 
        ];

        function mulberry32(a) {
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0; let t = a;
                t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        window.makePlateCanvas = function(p, seed, size) {
            size = size || 512;
            const w = size, h = size;
            const cvs = document.createElement('canvas');
            cvs.width = w; cvs.height = h;
            const ctx = cvs.getContext('2d');

            ctx.clearRect(0, 0, w, h);
            const bgGrad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w * 0.48);
            const hueValue = p.hue !== undefined ? p.hue : 350;
            bgGrad.addColorStop(0, `hsla(${hueValue}, 90%, 35%, 0.7)`);
            bgGrad.addColorStop(1, 'transparent');
            
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

            if (p.pattern === 'heart') {
                const cx = w/2, cy = h/2;
                const heartPath = (scale) => {
                    ctx.beginPath();
                    for (let t = 0; t <= Math.PI * 2 + 0.05; t += 0.04) {
                        const x = 16 * Math.pow(Math.sin(t), 3);
                        const y = -(13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
                        const px = cx + x * scale, py = cy + y * scale;
                        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                };
                ctx.globalAlpha = 0.95; ctx.fillStyle = '#ff66b2'; heartPath(13); ctx.fill();
                ctx.globalAlpha = 1;
            }
            return cvs;
        };
    </script>

    <script>
        // ----- FUNCIONES DEL RAMO -----
        function buildBouquet() {
            const bq = document.getElementById('bouquet-container');
            const txt = document.getElementById('bq-texts-container');
            
            // Inyectamos textos con retrasos escalonados
            txt.innerHTML = `
                <div class="bq-line" style="animation-delay: 1.5s;">Me haces muy feliz,</div>
                <div class="bq-line" style="animation-delay: 4.0s;">desde la primera vez que nos vimos todo es mejor,</div>
                <div class="bq-line" style="animation-delay: 6.5s;">gracias por todo y por aguantarme mis enojos jaja.</div>
                <div class="bq-line" style="animation-delay: 9.0s;">Te amo mucho,</div>
                <div class="bq-line" style="animation-delay: 11.0s;">estoy seguro que eres el amor de mi vida por eso...</div>
                <div class="bq-line final" style="animation-delay: 14.5s;">Estefany, ¿quieres ser mi novia?</div>
            `;

            // Construir matemáticamente 16 rosas para el ramo
            let html = '';
            for(let i = 0; i < 16; i++) {
                const isTulip = i % 2 === 0; // Mitad y mitad
                const pct = i / 15; // De 0 a 1
                const left = 35 + (pct * 30); // Se agrupan del 35% al 65% de la base
                const rot = -40 + (pct * 80); // Se abren de -40 a +40 grados
                const bottomOffset = 10 + (i % 3) * 15; // Pequeños desniveles en la altura
                const animDelay = (Math.random() * -3).toFixed(2); // Desfase aleatorio para el movimiento
                
                html += `
                <div class="flower" style="left: ${left}%; bottom: ${bottomOffset}px; --r: ${rot}deg; animation-delay: ${animDelay}s;">
                    <div class="stem"></div>
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                    <div class="${isTulip ? 'tulip-head' : 'iris-head'}">
                        <span></span><span></span><span></span>
                        ${!isTulip ? '<div class="center"></div>' : ''}
                    </div>
                </div>`;
            }
            bq.innerHTML = html;
        }

        function closeBouquet() {
            document.getElementById('bouquet-overlay').classList.remove('show');
            document.getElementById('bouquet-container').innerHTML = ''; // Limpiar para que la animación se reinicie si vuelven a entrar
        }

        // ----- LOGIN -----
        const loginWrapper = document.getElementById('login-wrapper');
        const loginScreen = document.getElementById('login-screen');
        const nameInput = document.getElementById('name-input');
        const btnEnter = document.getElementById('btn-enter');
        const errorMsg = document.getElementById('error-msg');

        function checkName() {
            const input = nameInput.value.trim().toLowerCase();
            const normalizedInput = input.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            
            if (normalizedInput === 'carlos') {
                loginWrapper.style.opacity = '0';
                loginScreen.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    loginWrapper.style.visibility = 'hidden';
                    try { 
                        startExperience(); 
                    } catch (error) {
                        console.error(error);
                        alert("Error de WebGL o de carga de red: " + error.message);
                    }
                }, 800);
            } else {
                errorMsg.style.display = 'block';
                nameInput.value = '';
                nameInput.focus();
            }
        }
        btnEnter.addEventListener('click', checkName);
        nameInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkName(); });
    </script>

    <script>
        let experienceStarted = false;
        let experienceStartMs = 0;

        function startExperience() {
            if (experienceStarted) return;
            if (typeof THREE === 'undefined') {
                throw new Error("La librería de gráficos 3D no se descargó correctamente.");
            }

            experienceStarted = true;
            experienceStartMs = performance.now();

            const canvas = document.getElementById('bg-canvas');
            const isMobile = window.innerWidth < 768;

            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.018);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(6, 4, 10);
            scene.add(camera);

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

            const controls = new THREE.OrbitControls(camera, canvas);
            controls.enableDamping = true; controls.enableZoom = true; controls.enablePan = true;
            controls.zoomSpeed = 0.8; controls.rotateSpeed = 0.5; controls.dampingFactor = 0.06;

            const parameters = {
                count: isMobile ? 25000 : 70000, size: isMobile ? 0.025 : 0.017,
                radius: 8, branches: 4, spin: 1, randomness: 0.3, randomnessPower: 3,
                insideColor: '#ffb3d9', outsideColor: '#ff1493', jetCount: isMobile ? 2500 : 6000
            };

            let geometry, material, points, jetGeometry, jetMaterial, jetPoints, blackHoleMesh, accretionMesh, accretionMeshHalo, accretionPoints;
            let initialsSprite = null; 
            let jetVelocities = [];

            const generateBlackHole = () => {
                blackHoleMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
                scene.add(blackHoleMesh);

                accretionMesh = new THREE.Mesh(
                    new THREE.RingGeometry(0.35, 0.85, 64, 8),
                    new THREE.MeshBasicMaterial({ color: 0xff66b2, side: THREE.DoubleSide, transparent: true, opacity: 0.78, blending: THREE.AdditiveBlending })
                );
                accretionMesh.rotation.x = Math.PI / 2;
                scene.add(accretionMesh);

                accretionMeshHalo = new THREE.Mesh(
                    new THREE.RingGeometry(0.32, 0.55, 64, 8),
                    new THREE.MeshBasicMaterial({ color: 0xff1493, side: THREE.DoubleSide, transparent: true, opacity: 0.48, blending: THREE.AdditiveBlending })
                );
                accretionMeshHalo.rotation.y = Math.PI / 3;
                scene.add(accretionMeshHalo);

                const accParticlesCount = isMobile ? 2000 : 5000;
                const accGeo = new THREE.BufferGeometry();
                const accPos = new Float32Array(accParticlesCount * 3);
                const accCol = new Float32Array(accParticlesCount * 3);
                const baseColor = new THREE.Color(0xff66b2);
                
                for (let i = 0; i < accParticlesCount; i++) {
                    const i3 = i * 3;
                    const r = 0.32 + Math.random() * 0.45;
                    const angle = Math.random() * Math.PI * 2;
                    accPos[i3] = Math.cos(angle) * r; accPos[i3+1] = (Math.random()-0.5)*0.02; accPos[i3+2] = Math.sin(angle) * r;
                    accCol[i3] = baseColor.r; accCol[i3+1] = baseColor.g; accCol[i3+2] = baseColor.b;
                }
                accGeo.setAttribute('position', new THREE.BufferAttribute(accPos, 3));
                accGeo.setAttribute('color', new THREE.BufferAttribute(accCol, 3));
                accretionPoints = new THREE.Points(accGeo, new THREE.PointsMaterial({ size: 0.014, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false }));
                scene.add(accretionPoints);
            };

            const generateGalaxy = () => {
                geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(parameters.count * 3);
                const colors    = new Float32Array(parameters.count * 3);
                const colorInside  = new THREE.Color(parameters.insideColor);
                const colorOutside = new THREE.Color(parameters.outsideColor);
                
                for (let i = 0; i < parameters.count; i++) {
                    const i3 = i * 3;
                    let radius = Math.random() * parameters.radius;
                    if (radius < 1.2) radius += 1.2;
                    const spinAngle   = radius * parameters.spin;
                    const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;
                    const rX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                    const rY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                    const rZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                    
                    positions[i3]   = Math.cos(branchAngle + spinAngle) * radius + rX;
                    positions[i3+1] = rY / 2;
                    positions[i3+2] = Math.sin(branchAngle + spinAngle) * radius + rZ;
                    
                    const mixedColor = colorInside.clone().lerp(colorOutside, radius / parameters.radius);
                    colors[i3] = mixedColor.r; colors[i3+1] = mixedColor.g; colors[i3+2] = mixedColor.b;
                }
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
                material = new THREE.PointsMaterial({ size: parameters.size, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true });
                points = new THREE.Points(geometry, material);
                scene.add(points);
            };

            const heartPoint = (t) => ({
                x: 16 * Math.pow(Math.sin(t), 3) * 0.13,
                y: (13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * 0.13
            });
            const insideHeart = (x, y) => {
                const X = x / 1.2, Y = y / 1.2;
                return Math.pow(X*X + Y*Y - 1, 3) - X*X * Y*Y*Y < 0;
            };

            const generateJet = () => {
                jetGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(parameters.jetCount * 3);
                const colors    = new Float32Array(parameters.jetCount * 3);
                jetVelocities = [];
                const heartCenterY = 3.2;
                let placed = 0;
                
                while (placed < parameters.jetCount) {
                    const i3 = placed * 3;
                    let px, py;
                    let isEdge = Math.random() < 0.75; 
                    
                    if (isEdge) {
                        const tParam = Math.random() * Math.PI * 2;
                        const hp = heartPoint(tParam);
                        const jitter = (Math.random() - 0.5) * 0.18;
                        const len = Math.sqrt(hp.x*hp.x + hp.y*hp.y) + 0.001;
                        px = hp.x + (hp.x / len) * jitter; py = hp.y + (hp.y / len) * jitter;
                    } else {
                        let attempts = 0;
                        do { px = (Math.random()-0.5)*5; py = (Math.random()-0.5)*5+0.4; attempts++; if (attempts > 30) { px = 0; py = 0; break; } } while (!insideHeart(px, py));
                    }
                    const pz = (Math.random() - 0.5) * 0.4;
                    positions[i3] = 0; positions[i3+1] = 0; positions[i3+2] = 0;
                    
                    jetVelocities.push({
                        basePx: px, basePy: py + heartCenterY, basePz: pz,
                        phase: Math.random() * Math.PI * 2, freq: 0.5 + Math.random() * 0.8, amp: 0.04 + Math.random() * 0.08,
                        emergeDelay: Math.random() * 0.9, emergeDuration: 0.7 + Math.random() * 0.7
                    });

                    const tt = Math.random();
                    if (isEdge) {
                        colors[i3] = 1.0; colors[i3+1] = 0.5 + tt * 0.5; colors[i3+2] = 0.8 + tt * 0.2; 
                    } else {
                        colors[i3] = 0.4 + tt * 0.3; colors[i3+1] = 0.0; colors[i3+2] = 0.1 + tt * 0.2; 
                    }
                    placed++;
                }
                jetGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                jetGeometry.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
                jetMaterial = new THREE.PointsMaterial({ size: parameters.size * 2.5, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.95 });
                jetPoints = new THREE.Points(jetGeometry, jetMaterial);
                scene.add(jetPoints);
            };

            const generateInitials = () => {
                const canvasText = document.createElement('canvas');
                canvasText.width = 512; canvasText.height = 256;
                const ctx = canvasText.getContext('2d');
                
                const gradient = ctx.createRadialGradient(256, 128, 10, 256, 128, 140);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.65)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient; ctx.fillRect(0, 0, 512, 256);

                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'italic bold 110px "Georgia", serif';
                
                ctx.shadowColor = '#ff66b2'; ctx.shadowBlur = 30; ctx.fillStyle = '#ffffff';
                ctx.fillText('E y C', 256, 128); ctx.shadowBlur = 15; ctx.fillText('E y C', 256, 128);
                
                const texture = new THREE.CanvasTexture(canvasText);
                const material = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, opacity: 0 });
                
                initialsSprite = new THREE.Sprite(material);
                initialsSprite.position.set(0, 3.2, 0); initialsSprite.scale.set(4.5, 2.25, 1);
                scene.add(initialsSprite);
            };

            const generateBgStars = () => {
                const starGeo = new THREE.BufferGeometry();
                const starCount = isMobile ? 1500 : 3500;
                const starPos = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount; i++) {
                    const i3 = i * 3;
                    const r = 30 + Math.random() * 120;
                    const theta = 2 * Math.PI * Math.random();
                    const phi = Math.acos(2 * Math.random() - 1);
                    starPos[i3] = r * Math.sin(phi) * Math.cos(theta);
                    starPos[i3+1] = r * Math.sin(phi) * Math.sin(theta);
                    starPos[i3+2] = r * Math.cos(phi);
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffdcf4, size: isMobile ? 0.07 : 0.04, transparent: true, opacity: 0.6, depthWrite: false })));
            };

            const plateGroup = new THREE.Group(); scene.add(plateGroup);
            const plateMeshes = [];
            
            function createCenteredPlateTexture(plate, fallbackCanvas) {
                const size = 1024;
                const cvs = document.createElement('canvas');
                cvs.width = size; cvs.height = size;
                const ctx = cvs.getContext('2d');
                
                if (plate.icon) {
                    const tex = new THREE.CanvasTexture(cvs);
                    tex.anisotropy = 8; tex.needsUpdate = true;
                    const image = new Image();
                    image.crossOrigin = 'anonymous';
                    image.onload = () => {
                        ctx.clearRect(0, 0, size, size);
                        const scale = Math.min(size / image.width, size / image.height) * 0.95; 
                        const drawW = image.width * scale; const drawH = image.height * scale;
                        const drawX = (size - drawW) / 2; const drawY = (size - drawH) / 2;
                        ctx.drawImage(image, drawX, drawY, drawW, drawH);
                        tex.needsUpdate = true;
                    };
                    image.src = plate.icon;
                    return tex;
                } else {
                    ctx.drawImage(fallbackCanvas, 0, 0, size, size);
                    const tex = new THREE.CanvasTexture(cvs);
                    tex.anisotropy = 8; tex.needsUpdate = true;
                    return tex;
                }
            }

            window.plates.forEach((p, i) => {
                const fallbackCanvas = window.makePlateCanvas(p, i * 137, 512);
                const canvasTex = createCenteredPlateTexture(p, fallbackCanvas);
                const mesh = new THREE.Mesh(new THREE.CircleGeometry(1.05 * 0.5, 64), new THREE.MeshBasicMaterial({ map: canvasTex, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
                mesh.userData = { plate: p, index: i };
                
                const total = window.plates.length;
                const pairIndex = Math.floor(i / 2);
                const pairs = Math.ceil(total / 2);
                const baseAngle = (pairIndex / pairs) * Math.PI * 2;
                const ring = i % 2;
                
                plateMeshes.push({ 
                    mesh, 
                    radius: ring === 0 ? 4.2 : 6.8, 
                    baseAngle: baseAngle, 
                    speed: ring === 0 ? 0.06 : -0.04, 
                    tilt: ring === 0 ? 0.15 : -0.2, 
                    yOffset: (ring === 0 ? 0.8 : -0.5) + Math.sin(i)*0.25, 
                    wobblePhase: i * 0.7,
                    isSpidey: p.isSpidey // Identificador para la escala
                });
                plateGroup.add(mesh);
            });

            generateBlackHole(); generateGalaxy(); generateJet(); generateInitials(); generateBgStars();

            if (points) points.visible = false;
            [accretionMesh, accretionMeshHalo, accretionPoints, blackHoleMesh, jetPoints].forEach(o => { if (o) o.visible = false; });
            plateMeshes.forEach(d => { d.mesh.visible = false; d.mesh.scale.set(0.001,0.001,0.001); });
            camera.position.set(40, 25, 50);

            const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
            const easeOutBack  = x => { const c = 1.70158; return 1 + (c+1) * Math.pow(x-1,3) + c * Math.pow(x-1,2); };

            const tick = () => {
                const t = (performance.now() - experienceStartMs) / 1000;

                if (t < 9) {
                    const p = easeOutCubic(Math.min(1, t / 9));
                    camera.position.lerpVectors(new THREE.Vector3(40,25,50), new THREE.Vector3(3.5,2.5,6), p);
                    controls.enabled = false;
                } else {
                    controls.enabled = true;
                }

                if (t > 0.8 && blackHoleMesh) {
                    blackHoleMesh.visible = accretionMesh.visible = accretionMeshHalo.visible = accretionPoints.visible = true;
                    const s = easeOutBack(Math.min(1, (t - 0.8) / 2.2));
                    [blackHoleMesh, accretionMesh, accretionMeshHalo, accretionPoints].forEach(o => o.scale.setScalar(s));
                }
                if (t > 2.5 && points) {
                    points.visible = true;
                    points.rotation.y = t * 0.05;
                    points.scale.setScalar(easeOutCubic(Math.min(1, (t - 2.5) / 4.5)));
                }

                if (t > 4.4 && jetPoints) {
                    jetPoints.visible = true;
                    const heartT = t - 4.4;
                    const pos = jetPoints.geometry.attributes.position.array;
                    for (let i = 0; i < parameters.jetCount; i++) {
                        const i3 = i * 3, v = jetVelocities[i];
                        const localT = heartT - v.emergeDelay;
                        if (localT <= 0) continue;
                        const p = Math.min(1, localT / v.emergeDuration);
                        const eased = 1 - Math.pow(1 - p, 3);
                        const beat = 1 + Math.sin(t * 2.2) * 0.04;
                        const fx = v.basePx * beat + Math.cos(v.phase) * Math.sin(t * v.freq + v.phase) * v.amp * 0.3;
                        const fy = (v.basePy - 3.2) * beat + 3.2;
                        const fz = v.basePz + Math.sin(t * v.freq * 0.7 + v.phase) * 0.15;
                        pos[i3] = fx * eased; pos[i3+1] = fy * eased + Math.sin(eased * Math.PI) * 0.6 * (1-eased); pos[i3+2] = fz * eased;
                    }
                    jetPoints.geometry.attributes.position.needsUpdate = true;

                    if (initialsSprite) {
                        const pInitials = Math.max(0, Math.min(1, (t - 4.4) / 2.0)); 
                        const easedInitials = 1 - Math.pow(1 - pInitials, 3);
                        const beatText = 1 + Math.sin(t * 2.2) * 0.05; 
                        
                        initialsSprite.scale.set(4.5 * beatText, 2.25 * beatText, 1);
                        initialsSprite.material.opacity = easedInitials * (0.8 + Math.sin(t * 3) * 0.2);
                    }
                }

                plateMeshes.forEach((d, i) => {
                    if (t > 5.8 + i * 0.12) {
                        d.mesh.visible = true;
                        const localP = Math.min(1, (t - 5.8 - i * 0.12) / 1.8);
                        const angle  = d.baseAngle + t * d.speed;
                        d.mesh.position.set(Math.cos(angle) * d.radius, d.yOffset + Math.sin(t * 0.4 + d.wobblePhase) * 0.3 + Math.sin(angle) * d.tilt, Math.sin(angle) * d.radius);
                        
                        // HACEMOS A SPIDERMAN MÁS GRANDE (El doble)
                        const baseScale = d.isSpidey ? 2.2 : 1.0; 
                        d.mesh.scale.setScalar(easeOutCubic(localP) * baseScale);
                        
                        d.mesh.lookAt(camera.position);
                    }
                });

                controls.update();
                renderer.render(scene, camera);
                window.requestAnimationFrame(tick);
            };
            tick();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
            canvas.addEventListener('pointerup', e => {
                if ((performance.now() - experienceStartMs)/1000 > 9) {
                    pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(pointer, camera);
                    const hits = raycaster.intersectObjects(plateMeshes.map(d => d.mesh).filter(m => m.visible), false);
                    if (hits.length > 0) {
                        const plate = hits[0].object.userData.plate;
                        
                        // LÓGICA DE SPIDERMAN -> ACTIVA EL RAMO DE FLORES
                        if (plate.isSpidey) {
                            document.getElementById('bouquet-overlay').classList.add('show');
                            buildBouquet(); 
                        } else {
                            // FOTOS NORMALES
                            document.getElementById('message-title').textContent = plate.name;
                            
                            const src = plate.src;
                            if(src){
                                document.getElementById('message-image').src = src;
                                document.getElementById('message-image-bg').src = src;
                            } else {
                                document.getElementById('message-image').src = window.makePlateCanvas(hits[0].object.userData.plate, hits[0].object.userData.index * 137, 512).toDataURL();
                                document.getElementById('message-image-bg').src = document.getElementById('message-image').src;
                            }
                            
                            document.getElementById('message-overlay').classList.add('show');
                        }
                    }
                }
            });
            document.getElementById('message-close').addEventListener('click', () => document.getElementById('message-overlay').classList.remove('show'));
        }
    </script>
</body>
</html>
